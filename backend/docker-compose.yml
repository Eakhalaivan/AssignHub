version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: academix-db
    restart: always
    environment:
      MYSQL_DATABASE: academix
      MYSQL_ROOT_PASSWORD: Eakhal@2004
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pEakhal@2004"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.0-alpine
    container_name: academix-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: academix-backend-app
    restart: always
    ports:
      - "8082:8082"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/academix?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=Eakhal@2004
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - JWT_SECRET=academix-super-secret-key-must-be-256-bits-long-for-hs256-algo
      - RAZORPAY_KEY_ID=rzp_test_XXXXXXXXXXXXXXXX
      - RAZORPAY_KEY_SECRET=XXXXXXXXXXXXXXXXXXXXXXXX
      - FILE_UPLOAD_DIR=/app/uploads
    volumes:
      - uploads-data:/app/uploads

volumes:
  mysql-data:
  redis-data:
  uploads-data:
